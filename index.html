<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Что требует решения</title>
  <style>
    :root{
      --bg:#fbfaf7;--paper:#ffffff;--ink:#141311;--muted:#5f5a54;--line:#e5ded3;
      --blue:#0b6bdc;--blue2:#eaf3ff;--green:#141311;--green2:#f0f7f2;
      --red:#bc2b2b;--red2:#fff0f0;--shadow:0 24px 70px rgba(42,34,22,.08);
      --safe:env(safe-area-inset-bottom,0px)
    }
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;border:0;background:none}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.985)}
    .app{width:430px;max-width:100vw;min-height:100vh;padding:18px 16px calc(28px + var(--safe));margin:0;background:radial-gradient(520px 260px at 50% -130px,#fff 0,#fbfaf7 72%);overflow:hidden}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;animation:rise .45s ease both}.brand{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 8px rgba(22,131,58,.07);animation:pulse 2s ease-in-out infinite}.mode{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.75);color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap}
    .hero{margin-bottom:18px;animation:rise .5s .05s ease both}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:var(--blue2);color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.02em}.hero h1{margin:13px 0 0;font-size:38px;line-height:.96;letter-spacing:-.065em;font-weight:850}.hero p{margin:13px 0 0;color:var(--muted);font-size:15px;line-height:1.35;max-width:330px;font-weight:520}
    .composer{border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.86);box-shadow:var(--shadow);padding:10px;display:grid;grid-template-columns:1fr 48px;gap:8px;margin-bottom:14px;animation:rise .5s .1s ease both;backdrop-filter:blur(18px)}.composer input{min-width:0;height:48px;border-radius:19px;background:#fbfaf7;padding:0 14px;color:var(--ink);outline:none;font-size:15px}.composer input::placeholder{color:#aaa39a}.add{height:48px;border-radius:19px;background:#161513;color:#fff;font-size:24px;font-weight:400;display:grid;place-items:center}
    .list{display:grid;gap:10px;animation:rise .5s .15s ease both}.item{position:relative;border:1px solid var(--line);border-radius:28px;background:var(--paper);box-shadow:0 14px 42px rgba(42,34,22,.075);padding:14px;overflow:hidden}.item:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:999px;background:var(--blue);opacity:1}.itemTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.item b{font-size:16px;line-height:1.18;letter-spacing:-.025em;color:var(--ink)}.tag{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#f4f1eb;color:var(--muted);font-size:11px;font-weight:760}.item p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.33;font-weight:520}.confirm{width:100%;height:52px;margin-top:13px;border-radius:20px;background:#141311;color:white;font-size:15px;font-weight:850;box-shadow:0 14px 28px rgba(20,19,17,.16)}.confirm.done{background:var(--green2);color:var(--green);box-shadow:none}.empty{border:1px dashed var(--line);border-radius:28px;background:rgba(255,255,255,.55);padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.4}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}.footer{margin-top:18px;color:#aaa39a;font-size:12px;line-height:1.35;text-align:center;animation:rise .5s .2s ease both}
    .toast{position:fixed;left:50%;bottom:calc(18px + var(--safe));transform:translate(-50%,16px);opacity:0;z-index:50;max-width:88vw;padding:12px 15px;border-radius:999px;background:#161513;color:#fff;font-size:13px;font-weight:780;box-shadow:var(--shadow);transition:.24s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 0 13px rgba(22,131,58,0)}}@media(max-width:370px){.hero h1{font-size:34px}.app{padding-left:13px;padding-right:13px}.composer{grid-template-columns:1fr 46px}.confirm{height:50px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><i class="dot"></i><span>Аркестратор</span></div><div class="mode" id="mode">просмотр</div></header>
    <section class="hero"><span class="eyebrow">один рабочий момент</span><h1>Что требует решения?</h1><p>Только короткий перечень. Ничего лишнего. Выбрал — подтвердил — пошли дальше.</p></section>
    <section class="composer"><input id="cmd" placeholder="Добавить вопрос или задачу…" /><button class="add" onclick="createDecision()" aria-label="Добавить">+</button></section>
    <section class="list" id="list"></section>
    <div class="footer">Минимальный режим: перечень → подтверждение → готово.</div>
  </main>
  <div class="toast" id="toast">Готово</div>
  <script>
    const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor('#fbfaf7');tg.setBackgroundColor('#fbfaf7')}
    const initData=tg?.initData||'';let approvals=[];const $=id=>document.getElementById(id);
    function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
    function headers(){return {'Content-Type':'application/json','X-Telegram-Init-Data':initData}}
    async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}});const d=await r.json().catch(()=>({ok:false,error:'не JSON'}));if(!r.ok||d.ok===false)throw new Error(d.reason||d.error||'ошибка');return d}
    function toast(text){const t=$('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
    function render(){const pending=approvals.filter(x=>x.status==='pending');$('list').innerHTML=pending.map((a,i)=>`<article class="item" style="animation:rise .42s ${i*.04}s ease both"><div class="itemTop"><b>${esc(a.title)}</b><span class="tag">решить</span></div><p>${esc(a.risk||'Нужно подтверждение, чтобы продолжить.')}</p><button class="confirm" onclick="confirmItem('${a.id}',this)">Подтвердить</button></article>`).join('')||'<div class="empty"><b>Пока чисто</b>Нет вопросов, которые требуют твоего решения.</div>'}
    async function refresh(){try{const [st,a]=await Promise.all([api('/api/status'),api('/api/approvals')]);$('mode').textContent=st.auth?.mode==='telegram-verified'?'проверено':'просмотр';approvals=a.approvals||[];render()}catch(e){toast('Ошибка: '+e.message);render()}}
    async function createDecision(){const v=$('cmd').value.trim();if(!v)return toast('Напиши коротко, что решить');try{await api('/api/approvals',{method:'POST',body:JSON.stringify({title:v,risk:'Нужно подтвердить.'})});$('cmd').value='';toast('Добавлено');await refresh()}catch(e){toast('Ошибка: '+e.message)}}
    async function confirmItem(id,btn){btn.textContent='Подтверждаю…';btn.classList.add('done');try{await api('/api/approvals/resolve',{method:'POST',body:JSON.stringify({id,action:'allow_once'})});toast('Подтверждено');await refresh()}catch(e){btn.textContent='Подтвердить';btn.classList.remove('done');toast('Ошибка: '+e.message)}}
    $('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')createDecision()});refresh();setInterval(refresh,9000);
  </script>
</body>
</html>
